/* ==== Tokens: the light register of styles.css :root. Re-copy them if the site's change. ==== */
:root {
  --paper: #F6F4F0; --paper-2: #EFECE6;
  --ink: #14100C; --ink-2: #5C564E; --ink-3: #6F675D;
  --accent: #3B6B44; --accent-ink: #2B5233; --accent-2: #6E9A5A;
  --font-display: "Crimson Pro", "Iowan Old Style", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.77, 0, .175, 1);
  --ease-soft: cubic-bezier(.33, 1, .68, 1);
  --ease-settle: cubic-bezier(.34, 1.56, .64, 1);
}

/* ==== The motion vocabulary. Every class takes --at (start, seconds from the scene's
   start) and --dur. A rise is the site's reveal: the travel on --ease-soft, the fade
   straight, so the block lands opaque. --y is 48px for a block, 12px for a line of type. ==== */
.rise { animation: m-rise var(--dur, .7s) var(--ease-soft) var(--at, 0s) both, m-in var(--dur, .7s) linear var(--at, 0s) both; }
.fade { animation: m-in var(--dur, .4s) linear var(--at, 0s) both; }
.leave { animation: m-out var(--dur, .4s) linear var(--at, 0s) both; }             /* put on a wrapper: one element, one list of animations */
.draw { stroke-dasharray: 1; animation: m-draw var(--dur, .5s) var(--ease) var(--at, 0s) both; }  /* the path carries pathLength="1" */
.wipe { animation: m-wipe var(--dur, .5s) var(--ease) var(--at, 0s) both; }
.grow { transform-origin: var(--origin, left center); animation: m-grow var(--dur, .5s) var(--ease) var(--at, 0s) both; }
@keyframes m-rise { from { translate: 0 var(--y, 48px); } to { translate: 0 0; } }
@keyframes m-in   { from { opacity: 0; } to { opacity: 1; } }
@keyframes m-out  { from { opacity: 1; } to { opacity: 0; } }
@keyframes m-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes m-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes m-grow { from { scale: 0 1; } to { scale: 1 1; } }

/* ==== Type roles, from styles.css at desktop size. Scale them with the stage. ==== */
.display { font: 400 64px/1.05 var(--font-display); letter-spacing: -.01em; color: var(--ink); margin: 0; text-wrap: balance; }
.stat    { font: 400 160px/1 var(--font-display); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--accent-ink); margin: 0; }
.lede    { font: 400 28px/1.4 var(--font-body); color: var(--ink); margin: 0; text-wrap: pretty; }
.small   { font: 400 22px/1.45 var(--font-body); color: var(--ink-2); margin: 0; text-wrap: pretty; }
.label   { font: 500 16px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0; }

/* ==== Stage and preview. Captured, the page is the stage at 0,0; opened in a browser,
   it plays on a loop, fitted to the window, with a scrubber under it. ==== */
html, body { margin: 0; }
body { min-height: 100vh; display: grid; place-content: center; gap: 16px; background: #2A2622; font: 500 13px/1 var(--font-mono); color: #CFC7BA; }
#stage { position: relative; overflow: hidden; background: var(--paper); color: var(--ink); zoom: var(--fit, 1); }
.capture body { display: block; min-height: 0; background: var(--paper); }
.capture #stage { zoom: 1; }
.capture #controls { display: none; }
#controls { display: flex; align-items: center; gap: 12px; }
#controls input { flex: 1; accent-color: var(--accent-2); }
#controls button { font: inherit; color: inherit; background: none; border: 1px solid #5C564E; border-radius: 6px; padding: 6px 10px; cursor: pointer; }

/* ==== The scene's own styles ==== */
.plate { position: absolute; inset: 0; padding: 96px; display: flex; flex-direction: column; justify-content: center; }
</style>

<body>
<div id="stage">
  <!-- The scene. Absolute times go on each element: style="--at: .4s; --dur: .7s". -->
  <div class="plate">
    <p class="label rise" style="--at: .2s; --y: 12px">Eyebrow</p>
    <p class="display rise" style="--at: .27s; --y: 12px; margin-top: 16px">Headline</p>
  </div>
</div>
<div id="controls"><button type="button" id="play">Pause</button><input id="scrub" type="range" min="0" step="0.001" aria-label="Time"><span id="time">0.00s</span></div>

<script>
/* ==== The scene: size in CSS px (capture --scale 2 doubles the output), length, beats. ====
   beats are the storyboard: capture.mjs stills renders one frame per beat, labelled.
   draw(t) is for what CSS keyframes can't do (counting, canvas, generative work): it gets
   the time in seconds and must draw the whole frame from it, remembering nothing between
   calls, so any frame can be rendered alone and in any order. */
const scene = {
  width: 1080, height: 1080, duration: 4, fps: 30,
  beats: [
    { t: 0, label: "Empty plate" },
    { t: .6, label: "Eyebrow and headline rising" },
    { t: 1.2, label: "Settled; hold" },
  ],
  draw(t) {},
};

/* ==== Runtime: leave this block as it is. ==== */
const bezier = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (s) => ((ax * s + bx) * s + cx) * s, Y = (s) => ((ay * s + by) * s + cy) * s, dX = (s) => (3 * ax * s + 2 * bx) * s + cx;
  return (x) => {
    if (x <= 0 || x >= 1) return x <= 0 ? 0 : 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const e = X(s) - x, d = dX(s); if (Math.abs(e) < 1e-6) return Y(s); if (Math.abs(d) < 1e-6) break; s -= e / d; }
    let lo = 0, hi = 1; s = x;
    for (let i = 0; i < 30; i++) { const v = X(s); if (Math.abs(v - x) < 1e-6) break; v < x ? (lo = s) : (hi = s); s = (lo + hi) / 2; }
    return Y(s);
  };
};
const ease = { linear: (x) => x, out: bezier(.23, 1, .32, 1), inOut: bezier(.77, 0, .175, 1), soft: bezier(.33, 1, .68, 1), settle: bezier(.34, 1.56, .64, 1) };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const tween = (t, at, dur, e = ease.soft) => e(clamp((t - at) / dur));   // 0 before at, 1 after at + dur
const lerp = (a, b, p) => a + (b - a) * p;

(() => {
  const root = document.documentElement, stage = document.getElementById("stage");
  const capture = new URLSearchParams(location.search).has("capture");
  root.classList.toggle("capture", capture);
  stage.style.width = scene.width + "px";
  stage.style.height = scene.height + "px";
  const faces = ['400 40px "Crimson Pro"', '400 20px "DM Sans"', '500 20px "DM Sans"', '500 20px "DM Mono"'];
  // Ready once the faces are in and every <img> is decoded; resolves to the faces that failed.
  // fonts.load() lists the faces it loaded, so an empty list means the file never arrived
  // (fonts.check() would say true: with no face declared, nothing is left to load).
  const ready = Promise.all([
    Promise.all(faces.map((f) => document.fonts.load(f).then((got) => (got.length ? null : f), () => f))),
    ...[...document.images].map((i) => i.decode().catch(() => {})),
  ]).then(([missing]) => document.fonts.ready.then(() => missing.filter(Boolean)));
  const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const scrub = document.getElementById("scrub"), time = document.getElementById("time"), btn = document.getElementById("play");
  const seek = (t) => {
    t = clamp(t, 0, scene.duration);
    for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; }
    scene.draw(t);
    scrub.value = t; time.textContent = t.toFixed(2) + "s";
    return frame();
  };
  window.__motion = { width: scene.width, height: scene.height, duration: scene.duration, fps: scene.fps, beats: scene.beats, ready, seek };
  if (capture) { ready.then(() => seek(0)); return; }

  // Preview: loop in real time; the scrubber and Space pause and seek.
  scrub.max = scene.duration;
  const fit = () => root.style.setProperty("--fit", Math.min(1, (innerWidth - 48) / scene.width, (innerHeight - 96) / scene.height));
  fit(); addEventListener("resize", fit);
  let playing = true, origin = 0, now = 0;
  const loop = (ms) => { if (playing) { now = ((ms - origin) / 1000) % scene.duration; seek(now); } requestAnimationFrame(loop); };
  const toggle = () => { playing = !playing; btn.textContent = playing ? "Pause" : "Play"; origin = performance.now() - now * 1000; };
  btn.onclick = toggle;
  addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); toggle(); } });
  scrub.oninput = () => { playing = false; btn.textContent = "Play"; now = +scrub.value; seek(now); };
  ready.then(() => { origin = performance.now(); requestAnimationFrame(loop); });
})();
</script>
</body>
