<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=a803d66e" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=fb53733d" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=94379a7d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css?v=f5ac8f0d">
</head>
<body class="dash-body deck-body">
<a class="skip" href="#main">Skip to content</a>

<header class="nav dash-nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="John DeSouza, home"><span>John DeSouza</span></a>
    <nav class="dash-tabs" aria-label="Owner pages">
      <a href="/admin/">Activity</a>
      <a href="/admin/deck.html" aria-current="page">Deck</a>
    </nav>
    <div class="dash-nav-actions">
      <span class="dash-live" id="live" role="status" data-state="connecting"><i class="dash-live-dot" aria-hidden="true"></i><span id="live-label">Reading the site</span></span>
      <a class="btn btn-ghost btn-sm" href="/admin/?signout">Sign out</a>
    </div>
  </div>
</header>

<main id="main" tabindex="-1" class="deck">
  <div class="wrap">
    <h1 class="sr-only">Deck</h1>

    <p class="dash-notice card" id="notice" hidden></p>

    <!-- The bar: where you are, the two arrows, and the switches. Every switch has a key. -->
    <div class="deck-bar" id="bar">
      <p class="deck-where t-small" id="where" aria-live="polite">Reading the site…</p>
      <div class="deck-arrows">
        <button class="ctl" type="button" id="prev" aria-label="Previous slide (left arrow)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
        <span class="deck-count t-small" id="count">–</span>
        <button class="ctl" type="button" id="next" aria-label="Next slide (right arrow)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      </div>
      <div class="deck-switches" role="group" aria-label="Deck controls">
        <button class="btn btn-ghost btn-sm" type="button" id="path" aria-pressed="false" aria-keyshortcuts="c">Compressed path</button>
        <button class="btn btn-ghost btn-sm" type="button" id="notes-btn" aria-pressed="false" aria-controls="notes" aria-keyshortcuts="n">Notes</button>
        <button class="btn btn-ghost btn-sm" type="button" id="grid-btn" aria-pressed="false" aria-controls="grid" aria-keyshortcuts="g">All slides</button>
        <button class="btn btn-primary btn-sm" type="button" id="present" aria-keyshortcuts="f">Present</button>
        <button class="deck-timer t-small" type="button" id="timer" aria-label="Elapsed time; press to reset" aria-keyshortcuts="t">00:00</button>
      </div>
    </div>

    <!-- The stage and the notes beside it. Fullscreen takes this block. -->
    <div class="deck-main" id="present-block">
      <div class="deck-stage" id="stage"></div>
      <aside class="deck-notes" id="notes" aria-label="Speaker notes" hidden>
        <p class="eyebrow" id="notes-head">Notes</p>
        <div class="deck-notes-body" id="notes-body"></div>
      </aside>
    </div>

    <p class="deck-keys t-small">Arrow keys move. <b>N</b> notes · <b>C</b> compressed path · <b>G</b> all slides · <b>F</b> present · <b>T</b> resets the clock. Built from the site's pages each time it opens, so a change on the site is a change here.</p>

    <!-- Every slide at once; a click goes there. -->
    <section class="deck-grid" id="grid" aria-label="All slides" hidden></section>

  </div>
</main>

<script src="deck-plan.js?v=b9c78206"></script>
<script src="deck.js?v=274339a0"></script>
</body>
</html>
